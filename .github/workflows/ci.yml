name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    # テストが増えて14〜15分かかり、15分では打ち切られるようになった（2026-10-18）。
    # 2026-11-13、17〜29分になり、統合テストを1件足した所で30分を越えて取り消された。45分に上げる
    timeout-minutes: 45
    steps:
      # 外のアクションはタグでなくコミットの SHA で固定する（タグは付け替えられる）。更新は Dependabot が出す
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run package:vsix
      - run: npm run verify:vsix
