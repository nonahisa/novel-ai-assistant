name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    # テストが増えて14〜15分かかり、15分では打ち切られるようになった（2026-10-18）。
    # 2026-11-13、17〜29分になり、統合テストを1件足した所で30分を越えて取り消された。45分に上げる
    timeout-minutes: 45
    steps:
      # 外のアクションはタグでなくコミットの SHA で固定する（タグは付け替えられる）。更新は Dependabot が出す
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run package:vsix
      - run: npm run verify:vsix
