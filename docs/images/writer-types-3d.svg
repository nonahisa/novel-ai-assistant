<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="'Yu Gothic UI','Yu Gothic','Meiryo',sans-serif"><rect width="1240" height="1000" fill="#fff"/><text x="62" y="78" font-size="42" font-weight="bold" fill="#1a1a1a">作者タイプ——3つの軸で11</text><text x="62" y="122" font-size="21" fill="#666">なぜ書くか。上下はありません。効く助言が違うだけです。</text><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f4f"/></marker></defs><polygon points="620,200 879.8076211353316,650 360.1923788646684,650" fill="#2f6f4f" opacity="0.05"/><line x1="620" y1="500" x2="620" y2="200" stroke="#2f6f4f" stroke-width="3" marker-end="url(#m)" opacity="0.85"/><text x="694" y="344" font-size="24" font-weight="bold" fill="#2f6f4f" text-anchor="middle">読者志向</text><text x="694" y="370" font-size="16" fill="#8a8a8a" text-anchor="middle">読者基準で判断する</text><line x1="620" y1="500" x2="879.8076211353316" y2="650" stroke="#2f6f4f" stroke-width="3" marker-end="url(#m)" opacity="0.85"/><text x="718.0999629903724" y="642.0858798800484" font-size="24" font-weight="bold" fill="#2f6f4f" text-anchor="middle">嗜好志向</text><text x="718.0999629903724" y="668.0858798800484" font-size="16" fill="#8a8a8a" text-anchor="middle">題材そのものが目的</text><line x1="620" y1="500" x2="360.1923788646684" y2="650" stroke="#2f6f4f" stroke-width="3" marker-end="url(#m)" opacity="0.85"/><text x="447.9000370096275" y="513.9141201199516" font-size="24" font-weight="bold" fill="#2f6f4f" text-anchor="middle">自分志向</text><text x="447.9000370096275" y="539.9141201199516" font-size="16" fill="#8a8a8a" text-anchor="middle">作品＝自分</text><circle cx="620" cy="200" r="9" fill="#2f6f4f"/><text x="620" y="148" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="middle">読者最適型</text><text x="620" y="175" font-size="16.5" fill="#777" text-anchor="middle">技術論がそのまま効く</text><circle cx="879.8076211353316" cy="650" r="9" fill="#2f6f4f"/><text x="909.2524848640026" y="675" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">嗜好探究型</text><text x="909.2524848640026" y="702" font-size="16.5" fill="#777" text-anchor="start">共感が先、技術論は後</text><circle cx="360.1923788646684" cy="650" r="9" fill="#2f6f4f"/><text x="330.74751513599745" y="675" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">内省表現型</text><text x="330.74751513599745" y="702" font-size="16.5" fill="#777" text-anchor="end">強い言葉は避ける</text><circle cx="778.1257519828887" cy="311.55306699273143" r="7" fill="#2f6f4f" opacity="0.75"/><text x="797.4093802734849" y="296.5717336991621" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">題材職人型</text><text x="797.4093802734849" y="323.5717336991621" font-size="16.5" fill="#777" text-anchor="start">その題材が届く層を見る</text><circle cx="862.2627072410031" cy="457.2825482939351" r="7" fill="#2f6f4f" opacity="0.75"/><text x="891.8069398313694" y="460.0731029639272" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">共感共有型</text><text x="891.8069398313694" y="487.0731029639272" font-size="16.5" fill="#777" text-anchor="start">同好者への届け方</text><circle cx="704.1369552581145" cy="731.1643847133334" r="7" fill="#2f6f4f" opacity="0.75"/><text x="714.3975595578846" y="767.3551633369107" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">私的神話型</text><text x="714.3975595578846" y="794.3551633369107" font-size="16.5" fill="#777" text-anchor="start">解釈を確かめてから触れる</text><circle cx="535.8630447418855" cy="731.1643847133334" r="7" fill="#2f6f4f" opacity="0.75"/><text x="525.6024404421155" y="767.3551633369107" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">世界没入型</text><text x="525.6024404421155" y="794.3551633369107" font-size="16.5" fill="#777" text-anchor="end">世界の内的整合から</text><circle cx="377.7372927589969" cy="457.2825482939351" r="7" fill="#2f6f4f" opacity="0.75"/><text x="348.1930601686306" y="460.07310296392717" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">対話表現型</text><text x="348.1930601686306" y="487.07310296392717" font-size="16.5" fill="#777" text-anchor="end">意図の翻訳を手伝う</text><circle cx="461.8742480171113" cy="311.5530669927315" r="7" fill="#2f6f4f" opacity="0.75"/><text x="442.5906197265151" y="296.5717336991621" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">発信表現型</text><text x="442.5906197265151" y="323.5717336991621" font-size="16.5" fill="#777" text-anchor="end">伝えたいことを確かめてから</text><circle cx="620" cy="500" r="58" fill="#fff" stroke="#2f6f4f" stroke-width="2.5" stroke-dasharray="5 5"/><text x="620" y="492" font-size="21" font-weight="bold" fill="#2f6f4f" text-anchor="middle">均衡模索型</text><text x="620" y="522" font-size="21" font-weight="bold" fill="#2f6f4f" text-anchor="middle">目的模索型</text><text x="62" y="832" font-size="19" font-weight="bold" fill="#555">中央の2つ</text><text x="62" y="872" font-size="21" font-weight="bold" fill="#1a1a1a">均衡模索型</text><text x="185" y="872" font-size="17" fill="#777">3軸とも中ほど。いちばん助言が効く帯です</text><text x="62" y="912" font-size="21" font-weight="bold" fill="#1a1a1a">目的模索型</text><text x="185" y="912" font-size="17" fill="#777">3軸とも低い。「何のために書くか」から</text><text x="62" y="966" font-size="16" fill="#9a9a9a">統合小説執筆環境 — 設計書6.86より　軸の先＝その軸だけが高い／軸と軸のあいだ＝主軸と副軸の組み合わせ</text></svg>