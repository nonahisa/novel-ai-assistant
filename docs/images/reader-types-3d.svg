<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="'Yu Gothic UI','Yu Gothic','Meiryo',sans-serif"><rect width="1240" height="1000" fill="#fff"/><text x="62" y="78" font-size="42" font-weight="bold" fill="#1a1a1a">読者タイプ——3つの軸で11</text><text x="62" y="122" font-size="21" fill="#666">何を求めて読むか。どちらが上等でもありません。</text><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a5f8f"/></marker></defs><polygon points="620,200 879.8076211353316,650 360.1923788646684,650" fill="#3a5f8f" opacity="0.05"/><line x1="620" y1="500" x2="620" y2="200" stroke="#3a5f8f" stroke-width="3" marker-end="url(#m)" opacity="0.85"/><text x="694" y="344" font-size="24" font-weight="bold" fill="#3a5f8f" text-anchor="middle">読み慣れ</text><text x="694" y="370" font-size="16" fill="#8a8a8a" text-anchor="middle">読み尽くしている</text><line x1="620" y1="500" x2="879.8076211353316" y2="650" stroke="#3a5f8f" stroke-width="3" marker-end="url(#m)" opacity="0.85"/><text x="718.0999629903724" y="642.0858798800484" font-size="24" font-weight="bold" fill="#3a5f8f" text-anchor="middle">求めるもの</text><text x="718.0999629903724" y="668.0858798800484" font-size="16" fill="#8a8a8a" text-anchor="middle">揺さぶり</text><line x1="620" y1="500" x2="360.1923788646684" y2="650" stroke="#3a5f8f" stroke-width="3" marker-end="url(#m)" opacity="0.85"/><text x="447.9000370096275" y="513.9141201199516" font-size="24" font-weight="bold" fill="#3a5f8f" text-anchor="middle">読む姿勢</text><text x="447.9000370096275" y="539.9141201199516" font-size="16" fill="#8a8a8a" text-anchor="middle">腰を据えて読む</text><circle cx="620" cy="200" r="9" fill="#3a5f8f"/><text x="620" y="148" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="middle">回遊層</text><text x="620" y="175" font-size="16.5" fill="#777" text-anchor="middle">本題まで早く着くこと</text><circle cx="879.8076211353316" cy="650" r="9" fill="#3a5f8f"/><text x="909.2524848640026" y="675" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">刺激層</text><text x="909.2524848640026" y="702" font-size="16.5" fill="#777" text-anchor="start">毎話なにかが起きる</text><circle cx="360.1923788646684" cy="650" r="9" fill="#3a5f8f"/><text x="330.74751513599745" y="675" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">没入層</text><text x="330.74751513599745" y="702" font-size="16.5" fill="#777" text-anchor="end">世界の手触り・情景</text><circle cx="778.1257519828887" cy="311.55306699273143" r="7" fill="#3a5f8f" opacity="0.75"/><text x="797.4093802734849" y="296.5717336991621" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">開拓層</text><text x="797.4093802734849" y="323.5717336991621" font-size="16.5" fill="#777" text-anchor="start">型を承知のうえで外す</text><circle cx="862.2627072410031" cy="457.2825482939351" r="7" fill="#3a5f8f" opacity="0.75"/><text x="891.8069398313694" y="460.0731029639272" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">裏読み層</text><text x="891.8069398313694" y="487.0731029639272" font-size="16.5" fill="#777" text-anchor="start">型を踏ませてから裏切る</text><circle cx="704.1369552581145" cy="731.1643847133334" r="7" fill="#3a5f8f" opacity="0.75"/><text x="714.3975595578846" y="767.3551633369107" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="start">余韻層</text><text x="714.3975595578846" y="794.3551633369107" font-size="16.5" fill="#777" text-anchor="start">言い切らずに終える</text><circle cx="535.8630447418855" cy="731.1643847133334" r="7" fill="#3a5f8f" opacity="0.75"/><text x="525.6024404421155" y="767.3551633369107" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">感涙層</text><text x="525.6024404421155" y="794.3551633369107" font-size="16.5" fill="#777" text-anchor="end">溜めてから放つこと</text><circle cx="377.7372927589969" cy="457.2825482939351" r="7" fill="#3a5f8f" opacity="0.75"/><text x="348.1930601686306" y="460.07310296392717" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">常連層</text><text x="348.1930601686306" y="487.07310296392717" font-size="16.5" fill="#777" text-anchor="end">更新が続くこと</text><circle cx="461.8742480171113" cy="311.5530669927315" r="7" fill="#3a5f8f" opacity="0.75"/><text x="442.5906197265151" y="296.5717336991621" font-size="25" font-weight="bold" fill="#1a1a1a" text-anchor="end">考察層</text><text x="442.5906197265151" y="323.5717336991621" font-size="16.5" fill="#777" text-anchor="end">伏線と設定どうしの筋</text><circle cx="620" cy="500" r="58" fill="#fff" stroke="#3a5f8f" stroke-width="2.5" stroke-dasharray="5 5"/><text x="620" y="492" font-size="21" font-weight="bold" fill="#3a5f8f" text-anchor="middle">雑食層</text><text x="620" y="522" font-size="21" font-weight="bold" fill="#3a5f8f" text-anchor="middle">すきま層</text><text x="62" y="832" font-size="19" font-weight="bold" fill="#555">中央の2つ</text><text x="62" y="872" font-size="21" font-weight="bold" fill="#1a1a1a">雑食層</text><text x="143" y="872" font-size="17" fill="#777">3軸とも中ほど。面白ければ何でも読みます</text><text x="62" y="912" font-size="21" font-weight="bold" fill="#1a1a1a">すきま層</text><text x="164" y="912" font-size="17" fill="#777">WEB小説でいちばん数の多い層です</text><text x="62" y="966" font-size="16" fill="#9a9a9a">統合小説執筆環境 — 設計書6.91より　※年齢層は軸にしていません</text></svg>